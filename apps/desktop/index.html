<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：真机上让页面铺到刘海与圆角之下，再由 CSS 的 safe-area 内边距躲开它们 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>oh-bilibili</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f6f7f8; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f6f7f8;
        pointer-events: none;
      }
      .boot-splash__tv {
        animation: boot-splash-bounce 900ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      @keyframes boot-splash-bounce {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        35% { transform: translateY(-10px) scale(0.98, 1.04); }
        70% { transform: translateY(0) scale(1.04, 0.94); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__tv { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="正在加载">
      <img src="/assets/illustrations/wink-tv.png" alt="" width="56" height="56" class="boot-splash__tv" />
    </div>
    <div id="root"></div>
    <!-- 本地打包，不走 CDN：桌面端要能离线播放 -->
    <script src="/vendor/shaka-player.compiled.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
