[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/bili",
  "crates/audio",
  "crates/store",
  "crates/lyrics",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
