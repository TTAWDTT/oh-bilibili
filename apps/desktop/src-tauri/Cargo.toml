[package]
name = "bilimusic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bilibili-powered desktop music player"

[lib]
name = "bilimusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
bilimusic-core = { path = "../../../crates/core" }
bilimusic-model = { path = "../../../crates/model" }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
