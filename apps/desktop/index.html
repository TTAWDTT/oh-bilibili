<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：真机上让页面铺到刘海与圆角之下，再由 CSS 的 safe-area 内边距躲开它们 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>oh-bilibili</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f6f7f8; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f6f7f8;
        pointer-events: none;
      }
      .boot-splash__tv {
        animation: boot-splash-bounce 900ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .boot-splash__eyes {
        transform-origin: 36px 36px;
        animation: boot-splash-blink 1.6s ease-in-out infinite;
      }
      @keyframes boot-splash-bounce {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        35% { transform: translateY(-10px) scale(0.98, 1.04); }
        70% { transform: translateY(0) scale(1.04, 0.94); }
      }
      @keyframes boot-splash-blink {
        0%, 80%, 100% { transform: scaleY(1); }
        88% { transform: scaleY(0.15); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__tv, .boot-splash__eyes { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="正在加载">
      <svg viewBox="0 0 72 56" width="72" height="56" aria-hidden="true" class="boot-splash__tv">
        <path d="M26 12 36 20M46 12 36 20" stroke="#00aeec" stroke-width="2.6" stroke-linecap="round" />
        <rect x="8" y="20" width="56" height="32" rx="9" fill="#00aeec" />
        <rect x="16" y="27" width="40" height="18" rx="5" fill="#fff" opacity="0.92" />
        <g class="boot-splash__eyes" fill="#00aeec">
          <rect x="24" y="32" width="4.5" height="9" rx="2.2" />
          <rect x="43" y="32" width="4.5" height="9" rx="2.2" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <!-- 本地打包，不走 CDN：桌面端要能离线播放 -->
    <script src="/vendor/shaka-player.compiled.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
